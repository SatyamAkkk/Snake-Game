<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Snake Game</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <main>
    <div class="infos">
      <div class="info">
        <span class="info-label">High Score</span>
        <span id="high-score">0</span>
      </div>
      <div class="info">
        <span class="info-label">Score</span>
        <span id="score">0</span>
      </div>
      <div class="info">
        <span class="info-label">Level</span>
        <span id="level">1</span>
      </div>
      <div class="info">
        <span class="info-label">Time</span>
        <span id="time">00:00</span>
      </div>
    </div>

    <div class="board-wrapper">
      <div class="board"></div>
    </div>

    <!-- On-screen D-Pad Controls for Small/Medium Devices -->
    <div class="controls-container">
      <div class="dpad">
        <button class="dpad-btn btn-up" data-dir="up" aria-label="Up">▲</button>
        <div class="dpad-middle">
          <button class="dpad-btn btn-left" data-dir="left" aria-label="Left">◀</button>
          <button class="dpad-btn btn-right" data-dir="right" aria-label="Right">▶</button>
        </div>
        <button class="dpad-btn btn-down" data-dir="down" aria-label="Down">▼</button>
      </div>
    </div>

    <p class="controls-hint">Arrow keys / WASD or On-screen controls</p>
  </main>

  <div class="modal">
    <div class="start-game">
      <h2>🐍 Snake</h2>
      <p>Eat food to grow. Don't hit the walls or yourself.</p>
      <div class="key-hints">
        <span>Use Arrow Keys, WASD, or On-Screen buttons to move</span>
      </div>
      <button class="btn btn-start">Start Game</button>
    </div>

    <div class="game-over">
      <h2>Game Over</h2>
      <p>Your score<br><strong id="final-score">0</strong></p>
      <button class="btn btn-restart">Play Again</button>
    </div>
  </div>

  <script src="script.js"></script>
</body>

</html>
